# Semua lokasi service dikontrol dari file ini.
#
# Path absolute maupun relative didukung.
#
# Contoh absolute:
# BACKEND_PATH=D:\Projects\MyApp\backend
# FRONTEND_PATH=D:\Projects\MyApp\frontend
